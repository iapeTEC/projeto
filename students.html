<!doctype html>
<html lang="pt-BR">
<head>
<title>Alunos • IAPE Gestão Estudantil</title>
   <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="//script.google.com">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
   <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="icons/favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="icons/site.webmanifest">
  <meta name="msapplication-TileColor" content="#0B1D39">
<script src="assets/config.js"></script>
<script src="assets/loading.js"></script>
<script src="assets/api.js"></script>
<script src="assets/ui.js"></script>

</head>
<body class="page-soft">
<div id="appNav"></div>
<div class="container app-page">
  <div id="toastArea"></div>

  <header class="page-heading">
    <div>
      <p class="page-eyebrow">Diretório acadêmico</p>
      <h1 class="page-title">Alunos</h1>
      <p class="page-description">Consulte dados acadêmicos, setor, bolsa e canais de contato em uma única visão.</p>
    </div>
    <div class="page-actions no-print">
      <button class="btn btn-outline-secondary" id="btnReset">Limpar filtros</button>
      <button class="btn btn-navy" id="btnReload">Atualizar</button>
    </div>
  </header>

  <div class="card mb-3" id="filters">
    <div class="card-header d-flex justify-content-between align-items-center"><strong>Busca e filtros</strong><span class="small-muted">Refine o diretório</span></div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-12 col-md-4">
          <label class="form-label">Busca (nome / telefone)</label>
          <input class="form-control" id="f_q" placeholder="Ex.: Maria, 8199...">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Status</label>
          <select class="form-select" id="f_status">
            <option value="">Todos</option>
            <option value="ACTIVE" selected>Ativos</option>
            <option value="INACTIVE">Inativos</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Sexo</label>
          <select class="form-select" id="f_sex">
            <option value="">Todos</option>
            <option value="M">M</option>
            <option value="F">F</option>
          </select>
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label">Setor</label>
          <select class="form-select" id="f_sector">
            <option value="">Todos</option>
          </select>
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">Tipo de bolsa</label>
          <select class="form-select" id="f_type">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Idade mínima</label>
          <input class="form-control" id="f_age_min" inputmode="numeric" placeholder="Ex.: 14">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Idade máxima</label>
          <input class="form-control" id="f_age_max" inputmode="numeric" placeholder="Ex.: 18">
        </div>
        <div class="col-12 col-md-4 d-flex align-items-end">
          <button class="btn btn-navy w-100" id="btnApply">Aplicar filtros</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Diretório de alunos</strong>
      <span class="badge badge-navy" id="countBadge">—</span>
    </div>
    <div class="card-body">
      <div class="table-responsive d-none d-md-block">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Aluno</th>
              <th>Setor</th>
              <th>Bolsa</th>
              <th>Idade</th>
              <th>Telefone</th>
              <th class="text-end">Contato</th>
            </tr>
          </thead>
          <tbody id="tblBody"></tbody>
        </table>
      </div>

      <div class="d-md-none" id="cardsList"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const user = window.UI.requireAuth();
  window.UI.mountNav("students");

  const el = (id)=>document.getElementById(id);

  function getFilters(){
    const f = {
      q: el("f_q").value.trim(),
      status: el("f_status").value.trim(),
      sex: el("f_sex").value.trim(),
      sector_id: el("f_sector").value.trim(),
      scholarship_type_id: el("f_type").value.trim(),
      age_min: el("f_age_min").value.trim(),
      age_max: el("f_age_max").value.trim()
    };
    // remove vazios
    Object.keys(f).forEach(k => { if(f[k] === "") delete f[k]; });
    return f;
  }

  let metaLoaded = false;

  function mountMeta(data){
    if(metaLoaded) return;
    const sectors = data.sectors || [];
    const scholarshipTypes = data.scholarship_types || [];
    if(sectors.length){
      const sel = el("f_sector");
      sectors.forEach(s=>{
        const opt = document.createElement("option");
        opt.value = s.sector_id;
        opt.textContent = s.name;
        sel.appendChild(opt);
      });
    }
    if(scholarshipTypes.length){
      const sel = el("f_type");
      scholarshipTypes.forEach(x=>{
        const opt = document.createElement("option");
        opt.value = x.type_id;
        opt.textContent = x.name;
        sel.appendChild(opt);
      });
    }
    metaLoaded = true;
  }

  function initials(name){
    return String(name || "").split(/\s+/).filter(Boolean).slice(0,2).map(part=>part.charAt(0).toUpperCase()).join("") || "A";
  }

  function avatarHtml(s){
    const name = window.Api.esc(initials(s.name));
    const raw = String(s.photo_url || "").trim();
    if(!/^(?:https?:\/\/|img\/)/i.test(raw)) return `<span class="student-list-avatar">${name}</span>`;
    return `<span class="student-list-avatar"><img src="${window.Api.esc(raw)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"></span>`;
  }

  function whatsappButton(value){
    const url = String(value || "").trim();
    if(!/^https:\/\/wa\.me\/\d+$/i.test(url)) return `<span class="text-muted small">—</span>`;
    return `<a class="btn btn-sm btn-outline-success" target="_blank" rel="noopener" href="${window.Api.esc(url)}">WhatsApp</a>`;
  }

  function rowHtml(s){
    const wa = s.whatsapp_link || "";
    const phone = s.phone_display || s.phone_e164 || "";
    const sector = s.sector_current_name || "";
    const type = s.scholarship_type_name || "";
    const age = s.age || "";
    const href = "student.html?student_id=" + encodeURIComponent(s.student_id);

    const btn = whatsappButton(wa);

    return `<tr>
      <td>
        <div class="d-flex align-items-center gap-2">${avatarHtml(s)}<div><div class="fw-semibold"><a href="${href}">${window.Api.esc(s.name)}</a></div>
        <div class="small text-muted">Registro ${window.Api.esc(s.student_id)}</div></div></div>
      </td>
      <td>${window.Api.esc(sector)}</td>
      <td>${window.Api.esc(type)}</td>
      <td>${window.Api.esc(age)}</td>
      <td>${window.Api.esc(phone)}</td>
      <td class="text-end">${btn}</td>
    </tr>`;
  }

  function cardHtml(s){
    const wa = s.whatsapp_link || "";
    const phone = s.phone_display || s.phone_e164 || "";
    const sector = s.sector_current_name || "";
    const type = s.scholarship_type_name || "";
    const age = s.age || "";
    const href = "student.html?student_id=" + encodeURIComponent(s.student_id);

    const btn = whatsappButton(wa);

    return `<div class="card mb-2">
      <div class="card-body">
        <div class="d-flex justify-content-between gap-2">
          <div class="d-flex gap-2">${avatarHtml(s)}<div>
            <div class="fw-semibold"><a href="${href}">${window.Api.esc(s.name)}</a></div>
            <div class="small text-muted">${window.Api.esc(sector)} • ${window.Api.esc(type)}</div>
            <div class="small text-muted">Idade: ${window.Api.esc(age)} • Tel: ${window.Api.esc(phone)}</div>
          </div></div>
          <div class="text-end">
            ${btn}
          </div>
        </div>
      </div>
    </div>`;
  }

  async function loadStudents(noCache){
    el("tblBody").innerHTML = "";
    el("cardsList").innerHTML = "";
    el("countBadge").textContent = "Carregando...";

    try{
      const data = await window.Api.apiPost("getStudentDirectory", {
        filters: getFilters(), include_meta: metaLoaded ? "FALSE" : "TRUE"
      }, { noCache: !!noCache });
      mountMeta(data);
      el("countBadge").textContent = String(data.count || 0);

      const rows = data.students || [];
      el("tblBody").innerHTML = rows.length ? rows.map(rowHtml).join("") : `<tr><td colspan="6" class="empty-table">Nenhum aluno encontrado com estes filtros.</td></tr>`;
      el("cardsList").innerHTML = rows.length ? rows.map(cardHtml).join("") : `<div class="empty-table">Nenhum aluno encontrado com estes filtros.</div>`;
    }catch(e){
      window.UI.toast(e.message || String(e), "err");
      el("countBadge").textContent = "—";
    }
  }

  function resetFilters(){
    el("f_q").value = "";
    el("f_status").value = "ACTIVE";
    el("f_sex").value = "";
    el("f_sector").value = "";
    el("f_type").value = "";
    el("f_age_min").value = "";
    el("f_age_max").value = "";
  }

  function loadWithFeedback(button, noCache){
    return window.Loading.run(()=>loadStudents(noCache), {
      button,
      buttonLabel:"Buscando…",
      message:"Atualizando a lista de alunos…"
    });
  }

  el("btnApply").addEventListener("click", ()=>loadWithFeedback(el("btnApply")));
  el("btnReload").addEventListener("click", ()=>loadWithFeedback(el("btnReload"), true));
  el("btnReset").addEventListener("click", ()=>{ resetFilters(); loadWithFeedback(el("btnReset")); });

  // Enter para aplicar
  ["f_q","f_age_min","f_age_max"].forEach(id=>{
    el(id).addEventListener("keydown",(ev)=>{ if(ev.key==="Enter") loadWithFeedback(el("btnApply")); });
  });

  (async function init(){
    await loadStudents();
  })();
})();
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
